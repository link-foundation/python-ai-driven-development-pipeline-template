name: Dependabot Health

on:
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:
  # Exercise the new workflow in PR CI without making unrelated PRs depend on
  # the age of an existing bot PR. The repository-wide scan runs on main.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/dependabot-health.yml'
      - 'scripts/check_dependabot_health.py'
      - 'tests/test_dependabot_health.py'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  health:
    name: Check Dependabot PR health
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-health
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify health policy in pull requests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/health-tests"
          "$RUNNER_TEMP/health-tests/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/health-tests/bin/python" -m pytest tests/test_dependabot_health.py

      - name: Report stuck Dependabot pull requests
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_dependabot_health.py

  pipeline-status:
    name: Pipeline Status
    needs: [health]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
